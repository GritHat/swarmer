name: agensi
# The Agensi edition of swarmer. On every push to main that changes the database, the documents or the edition:
# - the catalog (one JSON file per role, per strategy, per document) is regenerated and published on GitHub Pages,
#   branch gh-pages, under api/v1/latest/ and api/v1/<version>/: a new specialist reaches every Agensi user at once,
#   without a new version of the skill;
# - the skill package (SKILL.md, scripts/swarm.py, LICENSE.txt) is tested against that catalog and, when agensi/ changed,
#   attached to a release, ready for Agensi (update_skill, or Creator Studio → Update).
on:
  push:
    branches: [main]
    paths:
      - db/**
      - docs/en/**
      - i18n/en.json
      - engine/generate.py
      - engine/professionals.py
      - swarmer.sh
      - agensi/**
      - LICENSE
      - .claude-plugin/plugin.json
      - .github/scripts/agensi.py
      - .github/workflows/agensi.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: agensi
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-22.04
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the versions count commits
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: database valid, swarmer.sh up to date
        run: |
          python -I -B engine/professionals.py validate
          python -I -B engine/swarmer.py --swarm . build --output swarmer.sh --check
      - name: the site from gh-pages (the versions already published stay)
        run: |
          site="$RUNNER_TEMP/site"
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null; then
            git fetch --quiet origin gh-pages
            git worktree add -B gh-pages "$site" origin/gh-pages
          else
            git worktree add --detach "$site"
            git -C "$site" checkout --orphan gh-pages
            git -C "$site" rm -rf --quiet .
          fi
      - name: build the catalog and the package, and test them together
        id: build
        run: |
          python -I -B .github/scripts/agensi.py --api "$RUNNER_TEMP/site" --package "$RUNNER_TEMP/pkg/swarmer" \
            --zip "$RUNNER_TEMP/swarmer-agensi.zip" --test
          echo "catalog=$(python -I -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' "$RUNNER_TEMP/site/api/v1/latest/index.json")" >> "$GITHUB_OUTPUT"
          echo "package=$(sed -n 's/^version: //p' "$RUNNER_TEMP/pkg/swarmer/SKILL.md")" >> "$GITHUB_OUTPUT"
      - name: publish the catalog on gh-pages
        working-directory: ${{ runner.temp }}/site
        run: |
          git add -A
          if git diff --cached --quiet; then echo "catalog unchanged"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet -m "catalog ${{ steps.build.outputs.catalog }} from ${GITHUB_SHA::12}"
          git push origin gh-pages
      - uses: actions/upload-artifact@v4
        with:
          name: swarmer-agensi-${{ steps.build.outputs.package }}
          path: ${{ runner.temp }}/swarmer-agensi.zip
      - name: release the package for Agensi, if it is a new version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.build.outputs.package }}
        run: |
          tag="agensi-v$VERSION"
          if gh release view "$tag" > /dev/null 2>&1; then echo "$tag already released"; exit 0; fi
          zip="$RUNNER_TEMP/swarmer-agensi-$VERSION.zip"
          cp "$RUNNER_TEMP/swarmer-agensi.zip" "$zip"
          gh release create "$tag" "$zip" --target "$GITHUB_SHA" --latest=false \
            --title "Agensi package $VERSION" \
            --notes "Agensi edition of swarmer, built from $GITHUB_SHA: SKILL.md and scripts/swarm.py, which reads the catalog published on GitHub Pages. Publish it with update_skill (Agensi MCP) or upload the ZIP in Creator Studio → Update."
