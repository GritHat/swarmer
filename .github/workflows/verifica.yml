name: verifica
on: [push, pull_request]
jobs:
  verifica:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: ${{ matrix.python }}}
      - name: database, lingue, segreti / database, languages, secrets
        run: python3 -I motore/sciame.py --sciame . verifica
      - name: sciame.sh aggiornato / up to date
        run: python3 -I motore/sciame.py --sciame . costruisci --uscita sciame.sh --controlla
      - name: batterie / test batteries
        run: for p in prove/prova_*.py; do python3 -I "$p" || exit 1; done
