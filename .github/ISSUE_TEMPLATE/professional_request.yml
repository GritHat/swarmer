name: "Request a professional / Chiedi un professionista"
description: "A skill the swarm lacks / Una competenza che manca allo sciame"
labels: ["professional-request"]
body:
  - type: input
    id: code
    attributes: {label: "Role id / Sigla (lowercase, words joined by -)"}
    validations: {required: true}
  - type: dropdown
    id: kind
    attributes:
      label: "Type / Tipo"
      options: ["professional / professionista", "subprofessional / sottoprofessionista"]
    validations: {required: true}
  - type: input
    id: parent
    attributes: {label: "Parent (for a sub-professional) / Genitore (per un sottoprofessionista)"}
  - type: textarea
    id: why
    attributes: {label: "Reason: which roles you checked and why they do not cover it / Motivo: quali ruoli hai guardato e perché non bastano"}
    validations: {required: true}
